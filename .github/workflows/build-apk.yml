name: Construire l'APK GESTION D'ENTREPRISE
on:
  push:
    branches: [main]
    paths: ['www/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Lire la version
        id: v
        run: echo "version=$(grep -oP "APP_VERSION='\K[^']+" www/native.js)" >> "$GITHUB_OUTPUT"
      - name: Installer Capacitor
        run: npm install --no-audit --no-fund
      - name: Ajouter Firebase (fonctionne hors connexion)
        run: |
          cp node_modules/firebase/firebase-app-compat.js node_modules/firebase/firebase-auth-compat.js node_modules/firebase/firebase-firestore-compat.js www/lib/
          npx esbuild fb-entry.js --bundle --format=iife --global-name=FBM --minify --outfile=www/lib/firebase-mod.js
      - name: Préparer le projet Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ steps.v.outputs.version }}\"/" android/app/build.gradle
      - name: Compiler l'APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Signer l'APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          printf '%s' "$KEYSTORE_B64" | sed 's/^KEYSTORE_B64=//' | tr -d ' \r\n\t' | base64 -d > ks.jks
          KEYSTORE_PASS=$(printf '%s' "$KEYSTORE_PASS" | sed 's/^KEYSTORE_PASS=//' | tr -d ' \r\n\t')
          export KEYSTORE_PASS
          echo "Diagnostic : cle $(wc -c < ks.jks) octets (attendu 2706), empreinte $(sha256sum ks.jks | cut -c1-12) (attendu 998698f56573), mot de passe ${#KEYSTORE_PASS} caracteres (attendu 20)"
          if ! keytool -list -keystore ks.jks -storepass "$KEYSTORE_PASS" >/dev/null 2>&1; then
            echo "::error::Clé de signature illisible : recolle le secret KEYSTORE_B64 (tout le contenu de ks.b64) et KEYSTORE_PASS (le texte après KEYSTORE_PASS=)."
            exit 1
          fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks ks.jks --ks-key-alias chantierpro --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --out "GESTION-ENTREPRISE-${{ steps.v.outputs.version }}.apk" aligned.apk
          rm ks.jks
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: GESTION D'ENTREPRISE ${{ steps.v.outputs.version }}
          files: GESTION-ENTREPRISE-*.apk
          make_latest: true
